name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
    
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    
    - name: Sync Capacitor Android
      working-directory: ./frontend
      run: npx cap sync android
    
    - name: Build Android Debug APK
      working-directory: ./frontend/android
      run: ./gradlew assembleDebug
    
    - name: Build Android Release APK (unsigned)
      working-directory: ./frontend/android
      run: ./gradlew assembleRelease
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK (unsigned)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned
        path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
    
    - name: Show APK info
      run: |
        echo "=== Debug APK ==="
        ls -lh frontend/android/app/build/outputs/apk/debug/
        echo "=== Release APK ==="
        ls -lh frontend/android/app/build/outputs/apk/release/

  # 可选：签名并发布到 GitHub Release
  release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release-unsigned
        path: ./apk
    
    - name: Sign APK
      if: env.SIGNING_KEYSTORE != ''
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: ./apk
        signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE }}
        alias: ${{ secrets.SIGNING_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      id: sign_app
    
    - name: Upload Signed APK
      if: env.SIGNING_KEYSTORE != ''
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        retention-days: 90
