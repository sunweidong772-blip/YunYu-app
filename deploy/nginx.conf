# 云屿 YunYu · Nginx 反向代理示例（可选）
# 后端已自动托管前端构建产物，Nginx 仅负责 80/443 端口与 HTTPS 终结。
# 将下面的 server_name 替换为你的域名后放入 /etc/nginx/sites-available/ 。
#
# 使用 certbot 一键签发 HTTPS（推荐）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yunyu.example.com

server {
    listen 80;
    server_name yunyu.example.com;   # ← 改成你的域名

    # 上传大小限制（图片/附件场景按需调整）
    client_max_body_size 20m;

    # 静态资源缓存策略
    # 前端构建产物带哈希，可长期缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # 图标与 manifest 缓存
    location ~* \.(ico|png|svg|webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html 永不缓存（确保用户获取最新版本）
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket/SSE（云屿实时推送功能）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}